[package]
name = "zanplayer-lite"
version = "0.1.4"
description = "A modern, AI-powered subtitle player"
authors = ["you"]
license = "MIT"
repository = "https://github.com/micropsy/ZanPlayer-Lite.git"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
# Optional feature build only: locate the system libvlc (VLCKit's engine) for
# the `vlc-native` backend. On macOS we default to the dylibs bundled in
# /Applications/VLC.app; on Linux a `libvlc` pkg-config .pc probe is used.
pkg-config = "0.3"

[dependencies]
# `macos-private-api` is a no-op off macOS but must be enabled so tauri-build
# accepts the `app.macOSPrivateApi: true` config used for the transparent
# webview stage under the VLC video surface.
tauri = { version = "2.11.2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-http = "2.5.9"
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
whisper-rs = "0.16"
silero-vad-pure = "0.1.1"
crossbeam-channel = "0.5"
uuid = { version = "1.0", features = ["v4", "serde"] }
directories-next = "2.0"
regex = "1.10"
hound = "3.5"
# Raw window handles for the libvlc embed targets (X11 xwindow id, etc.).
raw-window-handle = { version = "0.6", optional = true }
# Native playback via the LibVLC C API (`libvlc` — the engine VLCKit wraps).
# Optional so the app still builds on machines without libvlc; when enabled,
# VLC renders into the native window surface behind the transparent webview
# stage. Uses the system libvlc (macOS: the dylibs bundled in /Applications/
# VLC.app; Linux: the distro `libvlc`; Windows: the `libvlc` DLL next to the
# binary). The previous mpv backend (libmpv2 / Render API / CAMetalLayer) has
# been removed entirely.
# (No `vlc` crate dependency: the FFI is declared locally in libvlc.rs.)

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Enables the in-window VLC player module (src-tauri/src/native_player).
# Replaces the old `native-player`/`macos-render` (mpv) gates with one
# backend. Shipped builds stay feature-off (HTML5 `<video>` is the default).
vlc-native = ["dep:raw-window-handle"]

# The macOS obsolescence of MPV is complete; the only macOS-specific ObjC we
# still link is the title-bar drag synthesis (macos_window.rs) and the
# dedicated host NSView that libvlc draws into (macos_surface in session.rs),
# both driven through plain `objc2` raw message dispatch.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Windows embed: libvlc draws into a child HWND we create under the top-level
# window; the DOM chrome stays above it via WebView2 (SetWindowPos re-order).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

# X11 embed: libvlc draws into a child X window we create; x11rb re-raises the
# webview above it. Best-effort only — Wayland compositors own stacking and
# ignore client-side re-order attempts.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }