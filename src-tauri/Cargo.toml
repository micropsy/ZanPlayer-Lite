[package]
name = "zanplayer-lite"
version = "0.1.2"
description = "A modern, AI-powered subtitle player"
authors = ["you"]
license = "MIT"
repository = "https://github.com/micropsy/ZanPlayer-Lite.git"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
# Feature build only: libmpv-sys emits `-lmpv` with no search path, which
# misses Homebrew/Apple-Silicon dylibs. pkg-config surfaces that path here.
pkg-config = "0.3"

[dependencies]
# `macos-private-api` is a no-op off macOS but must be enabled so tauri-build
# accepts the `app.macOSPrivateApi: true` config used for the transparent
# webview stage under the native mpv player.
tauri = { version = "2.11.2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-http = "2.5.9"
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
whisper-rs = "0.16"
silero-vad-pure = "0.1.1"
crossbeam-channel = "0.5"
uuid = { version = "1.0", features = ["v4", "serde"] }
directories-next = "2.0"
regex = "1.10"
hound = "3.5"
# Native playback via libmpv (feature `native-player`). Optional so the app
# still builds on machines without libmpv; when enabled, mpv renders into the
# native window surface behind the transparent webview stage.
# `libmpv2` targets the 2.x client API (mpv >= 0.35 / current Homebrew exposes
# 2.5), unlike the older `libmpv` crate which pinned 1.108 and got rejected at
# runtime by modern mpv ("VersionMismatch").
libmpv2 = { version = "6", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Enables the in-window mpv player module (src-tauri/src/native_player).
native-player = ["dep:libmpv2", "dep:raw-window-handle"]
# macOS-native playback via the libmpv Render API (software backend rendered
# into a Metal texture presented through a CAMetalLayer). Implies native-player.
# The window-VO `wid` embed is deliberately NOT used on macOS (it can still
# detach a top-level window); this Render-API backend is what un-gates macOS in
# `native_supported()` and only compiles behind this explicit flag.
macos-render = [
    "native-player",
    "dep:libmpv2-sys",
]

# macOS-only z-order enforcement: mpv's `wid` attachment adds its video view
# above the webview, which would bury HTML captions/OSD under the video. We
# re-sort the window's subviews so the transparent WKWebView sits on top.
# `libmpv2-sys` is the Render-API backend (macos-render): the SW render-context
# FFI. The Metal/CAMetalLayer surface is driven through plain `objc2` raw
# message dispatch (no framework crate), declared locally in macos_render.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
libmpv2-sys = { version = "4", optional = true }

# Windows z-order + geometry: mpv's video HWND (window class "mpv") is dropped
# to the bottom of the child stack with SetWindowPos so WebView2's DOM chrome
# stays above the decoded frames, and re-sized onto the DOM stage (GetDpiForWindow).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

# X11 z-order: raise the webview X window (x11rb, pure Rust, no libX11 link
# dependency) above mpv's child window. Best-effort only — Wayland compositors
# own the stacking and ignore client-side re-order attempts.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
