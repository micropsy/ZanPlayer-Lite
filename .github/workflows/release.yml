name: Release

# Builds and publishes a release. This workflow runs ONLY when:
#   - a `v*` tag is pushed — which is done exclusively by the release script
#     (`npm run release -- <major|minor|patch>`) — or
#   - `workflow_dispatch` is used to trigger it manually.
# Plain pushes to `main` run the separate `Test` workflow and never release.
# GitHub executes the workflow file from the pushed tag, so every released
# tag's commit must carry a copy of this workflow.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # Release matrix: signed dmg/appimage/deb/msi on 4 runners.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x64
            runner: macos-13
            args: "--bundles app,dmg --features vlc-native"
            artifact: macos-x64
          - platform: macos-aarch64
            runner: macos-latest
            args: "--bundles app,dmg --features vlc-native"
            artifact: macos-aarch64
          - platform: linux-x64
            runner: ubuntu-22.04
            args: "--bundles appimage,deb"
            artifact: linux-x64
          - platform: windows-x64
            runner: windows-latest
            args: "--bundles msi"
            artifact: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install VLC (bundled macOS native engine)
        if: runner.os == 'macOS'
        run: brew install --cask vlc

      # Stages /Applications/VLC.app libvlc + plugins into src-tauri/vendor/
      # so the macOS bundler copies them into the app (self-contained native
      # engine — shipped macOS builds no longer need VLC installed at runtime).
      - name: Stage bundled LibVLC
        if: runner.os == 'macOS'
        run: bash scripts/bundle-vlc.sh

      - name: Fetch FFmpeg static binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          PLATFORM="${{ matrix.platform }}"
          
          if [[ "$PLATFORM" == "macos-aarch64" ]]; then
            curl -L -o src-tauri/binaries/ffmpeg-aarch64-apple-darwin https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-arm64
            chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          elif [[ "$PLATFORM" == "macos-x64" ]]; then
            curl -L -o src-tauri/binaries/ffmpeg-x86_64-apple-darwin https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-x64
            chmod +x src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          elif [[ "$PLATFORM" == "linux-x64" ]]; then
            curl -L -o src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-linux-x64
            chmod +x src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          elif [[ "$PLATFORM" == "windows-x64" ]]; then
            curl -L -o src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-win32-x64
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(awk -v v="$VERSION" '
            $0 ~ ("^## \\[" v "\\]") { f = 1; next }
            f && /^## \[/ { f = 0 }
            f { print }
          ' CHANGELOG.md)"
          [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ] || NOTES="Automated release update for ZanPlayer Lite."
          {
            echo "notes<<ZANNOTES"
            printf '%s\n' "$NOTES"
            echo "ZANNOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Build app and publish release on tags
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ggml (vendored by whisper-rs-sys) uses std::filesystem, which the
          # macOS 15+ SDK marks unavailable below 10.15. whisper-rs-sys forwards
          # any CMAKE_* env as -D to CMake, whose trailing -mmacosx-version-min
          # wins, so the deployment target must be >= 10.15 on macOS builds.
          CMAKE_OSX_DEPLOYMENT_TARGET: '10.15'
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: 'ZanPlayer Lite v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.zip
            src-tauri/target/release/bundle/msi/*.sig
          if-no-files-found: warn