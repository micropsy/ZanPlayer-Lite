name: Build ZanPlayer Lite

# Two-tier pipeline:
#   - `test`  runs on every push to main (and on tag pushes) — cargo test +
#             vitest only, keeping regular commits cheap on CI minutes.
#   - `build` (the heavy Tauri release matrix: signed dmg/appimage/deb/msi on
#             4 runners) runs ONLY when a version tag (v*) is pushed by the
#             release script, or manually via workflow_dispatch. Plain branch
#             pushes to main never trigger it.
# GitHub executes the workflow file from the pushed tag, so every released
# tag's commit must carry a copy of this workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Run frontend tests
        run: npm run test

  build:
    # Gate the release matrix behind version tags so ordinary pushes to main
    # (which fire this workflow via the `branches: [main]` trigger above) only
    # pay for the lightweight `test` job. Manual workflow_dispatch still works.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x64
            runner: macos-13
            args: "--bundles app,dmg"
            artifact: macos-x64
          - platform: macos-aarch64
            runner: macos-latest
            args: "--bundles app,dmg"
            artifact: macos-aarch64
          - platform: linux-x64
            runner: ubuntu-22.04
            args: "--bundles appimage,deb"
            artifact: linux-x64
          - platform: windows-x64
            runner: windows-latest
            args: "--bundles msi"
            artifact: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Fetch FFmpeg static binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          PLATFORM="${{ matrix.platform }}"
          
          if [[ "$PLATFORM" == "macos-aarch64" ]]; then
            curl -L -o src-tauri/binaries/ffmpeg-aarch64-apple-darwin https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-arm64
            chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          elif [[ "$PLATFORM" == "macos-x64" ]]; then
            curl -L -o src-tauri/binaries/ffmpeg-x86_64-apple-darwin https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-x64
            chmod +x src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          elif [[ "$PLATFORM" == "linux-x64" ]]; then
            curl -L -o src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-linux-x64
            chmod +x src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          elif [[ "$PLATFORM" == "windows-x64" ]]; then
            curl -L -o src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-win32-x64
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and publish release on tags
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ggml (vendored by whisper-rs-sys) uses std::filesystem, which the
          # macOS 15+ SDK marks unavailable below 10.15. whisper-rs-sys forwards
          # any CMAKE_* env as -D to CMake, whose trailing -mmacosx-version-min
          # wins, so the deployment target must be >= 10.15 on macOS builds.
          CMAKE_OSX_DEPLOYMENT_TARGET: '10.15'
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: 'ZanPlayer Lite v__VERSION__'
          releaseBody: 'Automated release update for ZanPlayer Lite.'
          releaseDraft: false
          prerelease: false

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.zip
            src-tauri/target/release/bundle/msi/*.sig
          if-no-files-found: warn